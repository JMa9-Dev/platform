# Reusable CI workflow for .NET repositories: restore, lint (dotnet format), build and test.
# Call from an app repository:
#   jobs:
#     ci:
#       uses: JMa9-Dev/platform/.github/workflows/dotnet-ci.yml@main
name: dotnet-ci

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version to install
        type: string
        default: "10.0.x"
      working-directory:
        description: Directory containing the solution file
        type: string
        default: "."

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ inputs.working-directory }}/TestResults
          if-no-files-found: ignore
